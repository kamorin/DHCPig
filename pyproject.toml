[project]
name = "dhcpig"
version = "2.7.2"
description = "DHCP exhaustion / network-hardening validation tool (whitehat)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scapy>=2.5"]
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Kevin Amorin" }]
keywords = ["dhcp", "pentest", "security", "scapy", "exhaustion", "ipv4", "ipv6"]

[project.scripts]
dhcpig = "dhcpig.cli.main:main"
dhcpig-web = "dhcpig.web.server:main"

[project.optional-dependencies]
web = []   # web UI is Python stdlib only — no extra runtime deps
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhcpig"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true       # scapy ships no stubs

[[tool.mypy.overrides]]
module = "scapy.*"
follow_imports = "skip"             # scapy 2.7 ships py.typed but its `import *` re-exports
                                     # (Ether, IP, DHCP, ...) aren't resolvable by mypy

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs root/CAP_NET_RAW (deselect with -m 'not integration')"]
addopts = "-m 'not integration'"
